{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
# Every pod of the release (migration Job included): no ingress unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agile.fullname" . }}-default-deny
  labels: {{- include "agile.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
---
# Web: reachable from the ingress controller (or anyone when webIngressFrom is empty). Egress
# (appEgress): cluster DNS, Postgres, both mcp-atlassian services and public IPv4 on any port (the
# identity provider, Jira, LLM providers, Stripe, Langfuse, user-supplied SMTP and webhook hosts,
# guarded by the app's DNS-pinned check), plus the private CIDRs configured; never the metadata
# service, other private addresses or the rest of the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agile.fullname" . }}-web
  labels: {{- include "agile.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "agile.selector" (dict "root" . "component" "web") | nindent 6 }}
  policyTypes: [Ingress{{ if $np.appEgress.enabled }}, Egress{{ end }}]
  ingress:
    - ports: [{ port: 3000 }]
      {{- with $np.webIngressFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $np.appEgress.enabled }}
  egress: {{- include "agile.appEgress" (dict "root" . "component" "web") | nindent 4 }}
  {{- end }}
---
# Worker: nothing connects to it (probes come from the kubelet). Egress as for web, but only the
# read-only mcp-atlassian (the read-write one refuses it as well, in its own policy below).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agile.fullname" . }}-worker
  labels: {{- include "agile.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "agile.selector" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress{{ if $np.appEgress.enabled }}, Egress{{ end }}]
  ingress: []
  {{- if $np.appEgress.enabled }}
  egress: {{- include "agile.appEgress" (dict "root" . "component" "worker") | nindent 4 }}
  {{- end }}
{{- if .Values.mcpAtlassian.enabled }}
{{- range $instance := list "mcp-atlassian" "mcp-atlassian-readonly" }}
---
# {{ $instance }}: only {{ if eq $instance "mcp-atlassian" }}the web app{{ else }}the web app and the worker{{ end }} may call it (compose
# network `{{ if eq $instance "mcp-atlassian" }}mcp{{ else }}mcp-readonly{{ end }}`). Out: cluster DNS and public IPv4 addresses only (Jira
# Cloud, public Data Center), plus jiraPrivateCidrs; never Postgres or other cluster pods (its own
# URL check is not DNS-pinned like the app's). No IPv6 rule: IPv6 destinations are denied.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agile.fullname" $ }}-{{ $instance }}
  labels: {{- include "agile.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "agile.selector" (dict "root" $ "component" $instance) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: 8000 }]
      from:
        - podSelector:
            matchLabels: {{- include "agile.selector" (dict "root" $ "component" "web") | nindent 14 }}
        {{- if eq $instance "mcp-atlassian-readonly" }}
        - podSelector:
            matchLabels: {{- include "agile.selector" (dict "root" $ "component" "worker") | nindent 14 }}
        {{- end }}
  egress:
    {{- include "agile.dnsEgress" $ | nindent 4 }}
    {{- include "agile.publicEgress" $ | nindent 4 }}
    {{- range $np.jiraPrivateCidrs }}
    - to:
        - ipBlock: { cidr: {{ . | quote }} }
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
