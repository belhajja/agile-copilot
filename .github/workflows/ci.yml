name: ci
on:
  push:
    branches: [main]
  pull_request:
  # Run by hand to measure the agent on real providers (evals-live).
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Production build (no env needed)
        run: pnpm --filter @agile/web build
      - name: Worker production deploy (what the worker image ships)
        run: pnpm --filter @agile/worker deploy --prod --legacy /tmp/worker-deploy
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # check.sh downloads helm v4.3.0 and kubeconform v0.8.0 and verifies their sha256.
      - name: Lint, render and validate the Helm chart
        run: |
          sh deploy/helm/check.sh
          echo "$HELM_TOOLS_DIR" >> "$GITHUB_PATH"
        env:
          HELM_TOOLS_DIR: ${{ runner.temp }}/helm-tools
      - name: Rendered-chart tests (network policies, security contexts, env)
        run: pnpm vitest run packages/jira-tools/src/helm.test.ts
        env:
          HELM_REQUIRED: "1"
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deterministic mock model; plumbing checks only. No secret is passed to this job.
      # promptfoo is not a workspace dependency: the script fetches the pinned 0.123.1 (`pnpm dlx`).
      - run: pnpm --filter @agile/evals eval
  evals-live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Keys are secrets of the `evals-live` environment (protected by required reviewers).
    environment: evals-live
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agile/evals eval:live
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVAL_ANTHROPIC_MODEL: ${{ vars.EVAL_ANTHROPIC_MODEL }}
          EVAL_OPENAI_MODEL: ${{ vars.EVAL_OPENAI_MODEL }}
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agile
          POSTGRES_PASSWORD: agile_dev_password
          POSTGRES_DB: agile
        # Host port 5433 matches the defaults in e2e/playwright.config.ts and e2e/global-setup.ts
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U agile -d agile" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create app role
        run: |
          PGPASSWORD=agile_dev_password psql -h localhost -p 5433 -U agile -d agile -c \
            "CREATE ROLE app_user LOGIN PASSWORD 'app_user_dev_password'; GRANT USAGE ON SCHEMA public TO app_user;"
      - run: pnpm --filter @agile/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
