# Server deployment: the self-host stack with the images the GitLab pipeline publishes (nothing is
# built on the server) and Caddy in front for HTTPS (automatic Let's Encrypt certificates).
# Usage (see README "Deploying on a server"):
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.server.yml pull
#   docker compose -f docker-compose.selfhost.yml -f docker-compose.server.yml up -d
# Needs in .env, besides the self-host secrets: APP_DOMAIN (DNS pointing at this server) and
# ACME_EMAIL. Images default to the latest `develop` build; set WEB_IMAGE, WORKER_IMAGE and
# MIGRATE_IMAGE to pin a release (e.g. registry.gitlab.com/agile-copilot/agile-copilot/web:v1.0.0).
services:
  migrate:
    image: ${MIGRATE_IMAGE:-registry.gitlab.com/agile-copilot/agile-copilot/migrate/snapshot:develop}
    build: !reset null
  web:
    image: ${WEB_IMAGE:-registry.gitlab.com/agile-copilot/agile-copilot/web/snapshot:develop}
    build: !reset null
    # Reached through Caddy only.
    ports: !reset []
    environment:
      BETTER_AUTH_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
      # Caddy sets X-Forwarded-For to the client address (it trusts no incoming value).
      TRUSTED_PROXY_HOPS: "1"
  worker:
    image: ${WORKER_IMAGE:-registry.gitlab.com/agile-copilot/agile-copilot/worker/snapshot:develop}
    build: !reset null
    environment:
      BETTER_AUTH_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and keys: keep this volume (Let's Encrypt rate-limits re-issuing).
      - caddy_data:/data
      - caddy_config:/config
    depends_on: { web: { condition: service_healthy } }
volumes:
  caddy_data:
  caddy_config:
