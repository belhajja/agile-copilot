# Usage: cp .env.example .env (fill secrets), then: docker compose -f docker-compose.selfhost.yml up -d --build
# Services: postgres, migrate (one-shot), web (the app), worker (Jira sync and skill runs) and
# mcp-atlassian (the assistant's live Jira tools; a read-only twin, mcp-atlassian-readonly, serves
# skill runs and previews).
# Set WEB_PORT in .env to publish the app on a port other than 3000 (and match BETTER_AUTH_URL).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agile
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: agile
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agile -d agile"]
      interval: 2s
      retries: 30
  migrate:
    build: { context: ., dockerfile: apps/web/Dockerfile, target: migrate }
    environment:
      DATABASE_OWNER_URL: postgres://agile:${POSTGRES_PASSWORD}@postgres:5432/agile
    depends_on: { postgres: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, target: runner }
    restart: unless-stopped
    # Only what the app needs: never the owner credentials (POSTGRES_PASSWORD, DATABASE_OWNER_URL).
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-selfhost}
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD}@postgres:5432/agile
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS}
      ALLOWED_PRIVATE_HOSTS: ${ALLOWED_PRIVATE_HOSTS:-}
      ATLASSIAN_OAUTH_CLIENT_ID: ${ATLASSIAN_OAUTH_CLIENT_ID:-}
      ATLASSIAN_OAUTH_CLIENT_SECRET: ${ATLASSIAN_OAUTH_CLIENT_SECRET:-}
      # Single sign-on and the password policy (README "Single sign-on"). Web only: the worker
      # signs nobody in.
      OIDC_PROVIDER: ${OIDC_PROVIDER:-keycloak}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_DISPLAY_NAME: ${OIDC_DISPLAY_NAME:-SSO}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-all}
      BREAK_GLASS_EMAILS: ${BREAK_GLASS_EMAILS:-}
      # External AI clients (README "External AI clients (MCP)"): requests per person per minute,
      # and the proxies in front of the app that append the client address to X-Forwarded-For
      # (0: the app is published directly, as here; 1 behind one reverse proxy).
      MCP_RATE_LIMIT_PER_MINUTE: ${MCP_RATE_LIMIT_PER_MINUTE:-60}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-0}
      # Optional LLM tracing (Langfuse); off unless both keys are set.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      # No Stripe setting: self-host builds never bill (no plan limits).
      # The internal service only: the app sends users' Jira credentials to this URL.
      MCP_ATLASSIAN_URL: http://mcp-atlassian:8000/mcp
      # Skill previews read Jira through the read-only twin only.
      MCP_ATLASSIAN_READONLY_URL: http://mcp-atlassian-readonly:8000/mcp
      SKILL_RUNS_DAILY_LIMIT: ${SKILL_RUNS_DAILY_LIMIT:-50}
    ports: ["${WEB_PORT:-3000}:3000"]
    # `mcp`: the only service that can reach mcp-atlassian (and the only one it can reach);
    # `mcp-readonly`: the read-only twin, for skill previews (shared with the worker).
    networks: [default, mcp, mcp-readonly]
    healthcheck:
      # busybox wget ships with node:24-alpine
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Not on mcp-atlassian: the dashboards keep working when the assistant's sidecar is down (its
    # Jira tools then answer "unavailable").
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    build: { context: ., dockerfile: apps/web/Dockerfile, target: worker }
    restart: unless-stopped
    # On SIGTERM the worker aborts running jobs, then waits up to 190 s for them to record their
    # outcome (a skill run plus its delivery can take 180 s), with a 195 s backstop. Kubernetes:
    # terminationGracePeriodSeconds: 200.
    stop_grace_period: 200s
    # Only what the worker needs: never the owner credentials (POSTGRES_PASSWORD,
    # DATABASE_OWNER_URL), the SSO client secret or the password policy. BETTER_AUTH_* are
    # required by its env schema (the OAuth callback URL is derived from BETTER_AUTH_URL).
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-selfhost}
      DATABASE_URL: postgres://app_user:${APP_DB_PASSWORD}@postgres:5432/agile
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS}
      ALLOWED_PRIVATE_HOSTS: ${ALLOWED_PRIVATE_HOSTS:-}
      ATLASSIAN_OAUTH_CLIENT_ID: ${ATLASSIAN_OAUTH_CLIENT_ID:-}
      ATLASSIAN_OAUTH_CLIENT_SECRET: ${ATLASSIAN_OAUTH_CLIENT_SECRET:-}
      # Optional LLM tracing of skill runs (Langfuse); off unless both keys are set.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-15}
      # Scheduled and alert skill runs: read-only Jira tools only, through the read-only twin.
      MCP_ATLASSIAN_READONLY_URL: http://mcp-atlassian-readonly:8000/mcp
      SKILL_RUNS_DAILY_LIMIT: ${SKILL_RUNS_DAILY_LIMIT:-50}
      # Listen on all interfaces inside the container for the health check; no port is published.
      WORKER_HEALTH_HOST: 0.0.0.0
      WORKER_HEALTH_PORT: "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on: { migrate: { condition: service_completed_successfully } }
    # Skill runs reach the read-only twin only (never `mcp`, the read-write instance).
    networks: [default, mcp-readonly]
  # One shared instance for every workspace: each request carries its own Jira URL and token (Data
  # Center) or OAuth token and cloud id (Cloud). Never set JIRA_URL, Jira tokens or
  # ALLOW_GLOBAL_CRED_FALLBACK here. Not published: only the web app reaches it, on the `mcp`
  # network, which it shares with nothing else (not Postgres, not the worker): its own outbound
  # check (MCP_ALLOWED_URL_DOMAINS) is not DNS-pinned like the app's.
  mcp-atlassian:
    # Pinned by digest; must equal MCP_ATLASSIAN_IMAGE in packages/jira-tools/src/image.ts (tested).
    image: ghcr.io/sooperset/mcp-atlassian:0.23.1@sha256:5b7c9b64d4eb3210cab74be8bf3e6aeea9ed14f3042dc59ba5c5287bd4dbe466
    restart: unless-stopped
    mem_limit: 512m
    environment:
      TRANSPORT: streamable-http
      PORT: "8000"
      TOOLSETS: all
      # MCP_ATLASSIAN_ENABLED_TOOLS in packages/jira-tools/src/mcp-backend.ts (tested): the catalog
      # plus jira_search_assignable_users, which the backend uses to resolve assignees.
      ENABLED_TOOLS: jira_search,jira_get_issue,jira_get_transitions,jira_get_agile_boards,jira_get_sprints_from_board,jira_get_sprint_issues,jira_add_comment,jira_transition_issue,jira_assign_issue,jira_create_issue,jira_update_issue,jira_search_assignable_users
      ATLASSIAN_OAUTH_ENABLE: "true"
      # Data Center hosts that resolve to private addresses. Empty = unset. Once set, it is an
      # allowlist for every Data Center host, public ones included: list them all.
      MCP_ALLOWED_URL_DOMAINS: ${MCP_ALLOWED_URL_DOMAINS:-}
    networks: [mcp]
    healthcheck: &mcp-atlassian-health
      # busybox wget ships with the image
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
  # Same, with the read tools only and READ_ONLY_MODE: skill runs (worker) and skill previews (web)
  # read Jira through it, never through the read-write instance. Not published. Its own network,
  # `mcp-readonly`, is shared by web and worker only: the worker can reach this twin and nothing on
  # `mcp` (the read-write instance).
  mcp-atlassian-readonly:
    image: ghcr.io/sooperset/mcp-atlassian:0.23.1@sha256:5b7c9b64d4eb3210cab74be8bf3e6aeea9ed14f3042dc59ba5c5287bd4dbe466
    restart: unless-stopped
    mem_limit: 512m
    environment:
      TRANSPORT: streamable-http
      PORT: "8000"
      TOOLSETS: all
      # MCP_ATLASSIAN_READONLY_ENABLED_TOOLS in packages/jira-tools/src/mcp-backend.ts (tested).
      ENABLED_TOOLS: jira_search,jira_get_issue,jira_get_transitions,jira_get_agile_boards,jira_get_sprints_from_board,jira_get_sprint_issues
      READ_ONLY_MODE: "true"
      ATLASSIAN_OAUTH_ENABLE: "true"
      MCP_ALLOWED_URL_DOMAINS: ${MCP_ALLOWED_URL_DOMAINS:-}
    networks: [mcp-readonly]
    healthcheck: *mcp-atlassian-health
networks:
  # A normal bridge network (Jira on the internet stays reachable), shared by web and mcp-atlassian.
  mcp: {}
  # The same for the read-only twin, shared by web (previews) and the worker (skill runs).
  mcp-readonly: {}
volumes:
  pgdata:
