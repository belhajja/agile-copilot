default:
  image: node:24-bookworm
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.14.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [check, e2e]

check:
  stage: check
  # A hung step fails the job here instead of running until the job token expires (60 min).
  timeout: 30 minutes
  # No artifacts from earlier jobs: Biome would check them (e.g. hadolint reports/*.json).
  dependencies: []
  # Database tests start Postgres through Testcontainers, which needs a Docker daemon.
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    # Each `tsc` takes up to ~2 GB; turbo's default of 10 at once exhausts the small runner (8 GB)
    # and `pnpm typecheck` hangs.
    TURBO_CONCURRENCY: "2"
  script:
    - pnpm lint
    - pnpm typecheck
    - pnpm test
    - pnpm --filter @agile/web build
    # The worker image is built from this production deploy (see apps/web/Dockerfile, target worker).
    - pnpm --filter @agile/worker deploy --prod --legacy /tmp/worker-deploy

# The Helm chart: lint, render and validate against the Kubernetes schemas, then the rendered-chart
# tests. check.sh downloads helm v4.3.0 and kubeconform v0.8.0 and verifies their sha256.
helm:
  stage: check
  variables:
    HELM_TOOLS_DIR: /tmp/helm-tools
    HELM_REQUIRED: "1"
  script:
    - sh deploy/helm/check.sh
    - PATH="$HELM_TOOLS_DIR:$PATH" pnpm vitest run packages/jira-tools/src/helm.test.ts

# Agent evals (promptfoo): the real agent, tools, approvals and data envelopes against a scripted,
# deterministic mock model on the demo Jira data. Every test must pass. These are plumbing checks
# (tools offered, numbers flowing back from the metrics engine, approvals, envelopes), not a model
# quality measure. No secret is configured or read here: no provider key, no Jira credential.
evals:
  stage: check
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    # promptfoo is not a dependency of the workspace: the script fetches the pinned 0.123.1 itself
    # (`pnpm dlx`, ~1.7 GB), only in the evals jobs.
    - pnpm --filter @agile/evals eval

# The same evals against real providers: manual and opt-in, on protected branches only. The keys are
# CI/CD variables that are masked, protected (so only protected branches and tags get them) and
# scoped to the `evals-live` environment (Settings > CI/CD > Variables > Environments), never set
# for all environments. Needs ANTHROPIC_API_KEY, OPENAI_API_KEY, EVAL_ANTHROPIC_MODEL and
# EVAL_OPENAI_MODEL; passes at 90% of tests (stochastic models).
evals-live:
  stage: check
  environment:
    name: evals-live
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: true
  services:
    - name: docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    # Fetches the pinned promptfoo itself (`pnpm dlx`), as the evals job does.
    - pnpm --filter @agile/evals eval:live

e2e:
  stage: e2e
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: agile
    POSTGRES_PASSWORD: agile_dev_password
    POSTGRES_DB: agile
    DATABASE_OWNER_URL: postgres://agile:agile_dev_password@postgres:5432/agile
    E2E_DATABASE_URL: postgres://app_user:app_user_dev_password@postgres:5432/agile
    CI: "true"
  script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client >/dev/null
    - until pg_isready -h postgres -U agile -d agile; do sleep 1; done
    # Same non-owner role the compose init script creates, so RLS applies to the app.
    - >-
      PGPASSWORD=agile_dev_password psql -h postgres -U agile -d agile -v ON_ERROR_STOP=1 -c
      "CREATE ROLE app_user LOGIN PASSWORD 'app_user_dev_password'; GRANT USAGE ON SCHEMA public TO app_user;"
    - pnpm --filter @agile/e2e exec playwright install --with-deps chromium
    - pnpm e2e
  artifacts:
    when: on_failure
    paths: [e2e/playwright-report, e2e/test-results]
    expire_in: 1 week
