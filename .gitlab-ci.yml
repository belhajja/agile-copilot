# The pipeline is built from to-be-continuous templates (https://to-be-continuous.gitlab.io/doc/):
# node (lint, typecheck, unit tests, web build, audit, Semgrep, SBOM), docker (hadolint, buildah,
# trivy, SBOM, publish), helm (lint, package, publish) and gitleaks. The jobs no template covers are
# below them: the Kubernetes schema validation of the chart, the agent evals and the e2e tests.
include:
  - component: $CI_SERVER_FQDN/to-be-continuous/node/gitlab-ci-node@5.4.0
    inputs:
      image: $DOCKER_HUB_MIRROR/library/node:24-bookworm
      manager: pnpm
      manager-version: 10.14.0
      install-extra-opts: --frozen-lockfile
      # Unit and integration tests (Vitest), with a JUnit report for the merge request.
      test-args: test --reporter=default --reporter=junit --outputFile.junit=reports/node-test.xunit.xml
      # The web app; the worker and migrate builds are the docker jobs.
      build-args: --filter @agile/web build
      build-dir: apps/web/.next/standalone
      lint-enabled: true
      typecheck-enabled: true
      # What ships: devDependencies (shadcn CLI, drizzle-kit) are build tools. Ignored advisories are
      # listed, with the reason, in pnpm-workspace.yaml (auditConfig).
      audit-args: --prod --audit-level=low
      # The template's defaults, minus two rules that flag every `obj[key]` and `new RegExp(x)`
      # (hundreds of hits, none actionable); merge requests only scan their diff, develop and main
      # scan everything.
      semgrep-args: >-
        --metrics off --disable-version-check --no-suppress-errors
        --exclude-rule gitlab.eslint.detect-object-injection
        --exclude-rule gitlab.eslint.detect-non-literal-regexp
  # Container images: hadolint, build with buildah, trivy scan and SBOM, then publish. Snapshots are
  # pushed on every pipeline; release images are published from main (manual) and from tags.
  - component: $CI_SERVER_FQDN/to-be-continuous/docker/gitlab-ci-docker@8.5.1
    inputs:
      file: apps/web/Dockerfile
      context-path: .
      # The images need Postgres and secrets to start, and define no HEALTHCHECK.
      healthcheck-disabled: true
      # The template's defaults plus an explicit gate: docker-trivy fails (it always passes
      # --exit-code 1) on HIGH or CRITICAL OS vulnerabilities that have a fix, or an end-of-life
      # base image. Lower severities are not reported; npm dependencies are covered by node-audit.
      trivy-args: >-
        --severity HIGH,CRITICAL --ignore-unfixed --pkg-types os --exit-on-eol 1
        --detection-priority comprehensive --disable-telemetry --skip-version-check
  # The chart: `helm lint --strict`, package, and publish to this project's OCI registry from main.
  - component: $CI_SERVER_FQDN/to-be-continuous/helm/gitlab-ci-helm@9.7.0
    inputs:
      chart-dir: deploy/helm/agile-copilot
      # The chart refuses to render without the name of the Secret a deployment creates.
      lint-args: lint --strict --set secrets.existingSecret=agile-secrets
  - component: $CI_SERVER_FQDN/to-be-continuous/gitleaks/gitlab-ci-gitleaks@2.11.0

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

stages: [build, test, package-build, package-test, infra, deploy, acceptance, publish, infra-prod, production]

variables:
  # Docker Hub images come through Orange's mirror (anonymous pulls): the shared runners share one
  # address and hit Docker Hub's anonymous pull limit. Testcontainers (Postgres, Mailpit) too.
  DOCKER_HUB_MIRROR: dockerproxy.repos.tech.orange
  TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: dockerproxy.repos.tech.orange/
  # Each `tsc` takes up to ~2 GB; turbo's default of 10 at once exhausts the small runner (8 GB)
  # and `pnpm typecheck` hangs.
  TURBO_CONCURRENCY: "2"

# Biome instead of the template's ESLint: same job, with the GitLab code quality report it declares.
node-lint:
  script:
    - mkdir -p reports
    - pnpm exec biome ci --reporter=default --reporter=gitlab --reporter-file=reports/node-lint.gitlab.json .

# Database tests start Postgres through Testcontainers, which needs a Docker daemon: only the
# graas-dind runners have one (untagged jobs land on the standard runners, without Docker).
node-build:
  # A hung step fails the job here instead of running until the job token expires (60 min).
  timeout: 30 minutes
  tags: [graas-dind]
  services:
    - name: $DOCKER_HUB_MIRROR/library/docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  # The standalone build (the artifact) is served by e2e as the image serves it: with the static
  # assets copied next to server.js (apps/web/Dockerfile, runner stage).
  after_script:
    - >-
      if [ -f apps/web/.next/standalone/apps/web/server.js ] && [ -d apps/web/.next/static ]; then
      cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/; fi

# One image per Dockerfile target, named like the Helm chart's image.web/worker/migrate.
# The build cache goes to <target>/cache: the default (<snapshot image>/cache = web/snapshot/cache) is
# one level deeper than the GitLab registry allows (two below the project), and is refused.
.docker-base:
  parallel:
    matrix:
      - DOCKER_ARTIFACTS_NAMESPACE: web
        DOCKER_BUILD_ARGS: --target runner --build-arg BASE_REGISTRY=$DOCKER_HUB_MIRROR
        DOCKER_SNAPSHOT_IMAGE: $CI_REGISTRY_IMAGE/web/snapshot:$CI_COMMIT_REF_SLUG
        DOCKER_RELEASE_IMAGE: $CI_REGISTRY_IMAGE/web:$CI_COMMIT_REF_NAME
        DOCKER_BUILD_CACHE_LOCATION: $CI_REGISTRY_IMAGE/web/cache
      - DOCKER_ARTIFACTS_NAMESPACE: worker
        DOCKER_BUILD_ARGS: --target worker --build-arg BASE_REGISTRY=$DOCKER_HUB_MIRROR
        DOCKER_SNAPSHOT_IMAGE: $CI_REGISTRY_IMAGE/worker/snapshot:$CI_COMMIT_REF_SLUG
        DOCKER_RELEASE_IMAGE: $CI_REGISTRY_IMAGE/worker:$CI_COMMIT_REF_NAME
        DOCKER_BUILD_CACHE_LOCATION: $CI_REGISTRY_IMAGE/worker/cache
      - DOCKER_ARTIFACTS_NAMESPACE: migrate
        DOCKER_BUILD_ARGS: --target migrate --build-arg BASE_REGISTRY=$DOCKER_HUB_MIRROR
        DOCKER_SNAPSHOT_IMAGE: $CI_REGISTRY_IMAGE/migrate/snapshot:$CI_COMMIT_REF_SLUG
        DOCKER_RELEASE_IMAGE: $CI_REGISTRY_IMAGE/migrate:$CI_COMMIT_REF_NAME
        DOCKER_BUILD_CACHE_LOCATION: $CI_REGISTRY_IMAGE/migrate/cache

# The docker template sets no timeouts: a stuck registry push or scan would hold a runner for the
# project's default (60 min). A cold build installs every dependency and builds the web app.
docker-hadolint:
  timeout: 10 minutes
docker-buildah-build:
  timeout: 40 minutes
docker-trivy:
  timeout: 20 minutes
docker-sbom:
  timeout: 20 minutes
docker-publish:
  timeout: 15 minutes

# Node jobs. Not under `default:`, which the to-be-continuous jobs would inherit.
.pnpm:
  image: $DOCKER_HUB_MIRROR/library/node:24-bookworm
  before_script:
    - corepack enable
    - corepack prepare pnpm@10.14.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

# The rendered chart against the Kubernetes schemas (kubeconform) for the default values and the
# variants a deployment may use, then the rendered-chart tests. check.sh downloads helm v4.3.0 and
# kubeconform v0.8.0 and verifies their sha256.
helm-kubeconform:
  extends: .pnpm
  stage: test
  timeout: 15 minutes
  variables:
    HELM_TOOLS_DIR: /tmp/helm-tools
    HELM_REQUIRED: "1"
  script:
    - sh deploy/helm/check.sh
    - PATH="$HELM_TOOLS_DIR:$PATH" pnpm vitest run packages/jira-tools/src/helm.test.ts

# `pnpm dlx promptfoo` installs into the same store as the workspace (.pnpm-store), so the evals
# jobs cache that store under their own key: promptfoo (~1.7 GB) is downloaded once per lockfile
# and promptfoo pin (evals/package.json), and the other jobs' cache stays its usual size.
.promptfoo-cache:
  cache:
    key:
      prefix: evals
      files: [pnpm-lock.yaml, evals/package.json]
    paths: [.pnpm-store]

# Agent evals (promptfoo): the real agent, tools, approvals and data envelopes against a scripted,
# deterministic mock model on the demo Jira data. Every test must pass. These are plumbing checks
# (tools offered, numbers flowing back from the metrics engine, approvals, envelopes), not a model
# quality measure. No secret is configured or read here: no provider key, no Jira credential.
evals:
  extends: [.pnpm, .promptfoo-cache]
  stage: test
  # Install, the promptfoo download and the Testcontainers Postgres; the scripted runs are short.
  timeout: 30 minutes
  tags: [graas-dind]
  services:
    - name: $DOCKER_HUB_MIRROR/library/docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    # promptfoo is not a dependency of the workspace: the script fetches the pinned 0.123.1 itself
    # (`pnpm dlx`, ~1.7 GB), only in the evals jobs.
    - pnpm --filter @agile/evals eval

# The same evals against real providers: manual and opt-in, on protected branches only. The keys are
# CI/CD variables that are masked, protected (so only protected branches and tags get them) and
# scoped to the `evals-live` environment (Settings > CI/CD > Variables > Environments), never set
# for all environments. Needs ANTHROPIC_API_KEY, OPENAI_API_KEY, EVAL_ANTHROPIC_MODEL and
# EVAL_OPENAI_MODEL; passes at 90% of tests (stochastic models).
evals-live:
  extends: [.pnpm, .promptfoo-cache]
  stage: test
  # As evals, plus real provider calls (rate limits, retries).
  timeout: 45 minutes
  tags: [graas-dind]
  environment:
    name: evals-live
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
      allow_failure: true
  services:
    - name: $DOCKER_HUB_MIRROR/library/docker:28-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    # Fetches the pinned promptfoo itself (`pnpm dlx`), as the evals job does.
    - pnpm --filter @agile/evals eval:live

e2e:
  extends: .pnpm
  stage: acceptance
  # Browser install, the web app build when there is none to reuse, then the suite.
  timeout: 40 minutes
  # node-build's standalone web app, served as is instead of building it again
  # (E2E_PREBUILT_WEB, e2e/playwright.config.ts). Without that artifact the tests build it.
  needs:
    - job: node-build
      artifacts: true
      optional: true
  services:
    - name: $DOCKER_HUB_MIRROR/library/postgres:17-alpine
      alias: postgres
  variables:
    E2E_PREBUILT_WEB: "1"
    POSTGRES_USER: agile
    POSTGRES_PASSWORD: agile_dev_password
    POSTGRES_DB: agile
    DATABASE_OWNER_URL: postgres://agile:agile_dev_password@postgres:5432/agile
    E2E_DATABASE_URL: postgres://app_user:app_user_dev_password@postgres:5432/agile
    CI: "true"
  script:
    - apt-get update -qq && apt-get install -y -qq postgresql-client >/dev/null
    # The service normally answers within seconds; give up after a minute instead of hanging.
    - timeout 60 sh -c 'until pg_isready -h postgres -U agile -d agile; do sleep 1; done'
    # Same non-owner role the compose init script creates, so RLS applies to the app.
    - >-
      PGPASSWORD=agile_dev_password psql -h postgres -U agile -d agile -v ON_ERROR_STOP=1 -c
      "CREATE ROLE app_user LOGIN PASSWORD 'app_user_dev_password'; GRANT USAGE ON SCHEMA public TO app_user;"
    - pnpm --filter @agile/e2e exec playwright install --with-deps chromium
    - pnpm e2e
  artifacts:
    when: on_failure
    paths: [e2e/playwright-report, e2e/test-results]
    expire_in: 1 week
